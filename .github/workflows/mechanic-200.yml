name: Mechanic 200-match simulation

on:
  push:
    branches:
      - mechanic-200-test-run

jobs:
  mechanic-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game and simulation syntax
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); print(s.split('<script>',1)[1].split('</script>',1)[0])" > /tmp/mist-card-game.js
          node --check /tmp/mist-card-game.js
          node --check tests/mechanic-200-match-simulation.test.js
      - name: Run 200 Mechanic matches
        run: node tests/mechanic-200-match-simulation.test.js
