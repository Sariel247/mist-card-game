name: All survivors 200-match simulation

on:
  push:
    branches:
      - all-characters-200-test

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 1,400 live-function matches
        run: node tests/automatic-match-simulation.test.js
