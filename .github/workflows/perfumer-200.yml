name: Perfumer 200-match simulation

on:
  push:
    branches:
      - perfumer-200-test

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 200 Perfumer matches
        run: node tests/perfumer-200-match-simulation.test.js
