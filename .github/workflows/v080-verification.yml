name: V0.8.0 verification

on:
  push:
    branches:
      - v0.8.0-development
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d')
          for file in tests/*.test.js; do node --check "$file"; done
      - name: Run regression tests
        run: |
          for file in tests/*.test.js; do
            echo "===== $file ====="
            node "$file"
          done
