<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111014">
<title>迷雾牌局 · Mist Card Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
:root{--bg:#111014;--panel:#1b191e;--panel2:#242027;--line:#51434a;--gold:#c7a878;--cream:#e8dfd0;--muted:#a99da0;--red:#a64f51;--green:#78917a;--shadow:0 18px 55px #0008}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:'Noto Serif SC',serif;background:radial-gradient(ellipse at 50% -10%,#46343a 0,#211c23 38%,#111014 78%);background-attachment:fixed}
button{font:inherit;cursor:pointer}.shell{max-width:1160px;margin:auto;padding:28px 22px 50px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #6d596044;padding-bottom:18px}.brand{font-family:'Ma Shan Zheng',cursive;font-size:34px;letter-spacing:4px;color:#e2c79c}.brand small{display:block;font:10px Georgia;letter-spacing:4px;color:#98877c;margin-top:2px}.version{font-size:11px;color:#b6a8a0;border:1px solid #76616a;padding:6px 10px;letter-spacing:1px}
.hero{text-align:center;padding:38px 0 28px}.eyebrow{font-size:11px;letter-spacing:5px;color:var(--gold)}h1{font-family:'Ma Shan Zheng',cursive;font-weight:400;font-size:clamp(38px,6vw,62px);letter-spacing:7px;margin:10px 0 6px;text-shadow:0 4px 22px #000}.subtitle{color:#b8aeb0;font-size:13px;letter-spacing:2px}
.panel{background:linear-gradient(145deg,#262128eF,#17151aF2);border:1px solid #74616a66;box-shadow:var(--shadow);position:relative}.panel:before{content:"";position:absolute;inset:7px;border:1px solid #c7a87818;pointer-events:none}
.setup{max-width:820px;margin:0 auto;padding:28px}.section-title{text-align:center;color:var(--gold);letter-spacing:3px;font-size:14px;margin:0 0 20px}.characters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.character{background:#17151a;border:1px solid #5a4b51;padding:18px 14px;text-align:left;color:var(--cream);transition:.2s;position:relative}.character:hover,.character.selected{border-color:var(--gold);background:#30262a;transform:translateY(-2px)}.character .sigil{font-size:28px;color:var(--gold)}.character h3{font-size:16px;margin:9px 0 5px}.character p{font-size:12px;color:#b7aaab;line-height:1.7;margin:0}.tag{font-size:10px;color:var(--gold);letter-spacing:2px;margin-top:12px}.start{display:block;margin:24px auto 0;background:linear-gradient(135deg,#b99562,#826344);border:1px solid #e0c18f;color:#171218;padding:12px 40px;letter-spacing:4px;font-weight:700;box-shadow:0 5px 20px #0006}.start:hover{filter:brightness(1.12)}
.game{display:none}.game.active{display:block}.setup.hidden{display:none}.arena{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fighter{padding:20px;min-height:150px}.fighter.enemy{border-top:2px solid #9b5556}.fighter.player{border-top:2px solid #82947b}.fighter-head{display:flex;justify-content:space-between;align-items:center}.fighter-name{font-size:18px}.role{font-size:10px;letter-spacing:2px;color:var(--muted)}.stats{display:flex;gap:18px;margin-top:17px}.stat{font-size:12px;color:#b9adae}.stat b{display:block;font:22px Georgia;color:var(--cream);margin-top:3px}.bar{height:5px;background:#423a40;margin-top:10px}.bar span{display:block;height:100%;background:var(--red);transition:width .3s}.player .bar span{background:var(--green)}
.statusline{text-align:center;margin:16px 0;color:#c7aa83;font-size:12px;letter-spacing:2px}.board{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.log{padding:18px;min-height:175px}.log h3,.hand-area h3{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:400;margin:0 0 12px}.loglist{font-size:12px;line-height:1.9;color:#bdb1b0;max-height:140px;overflow:auto}.loglist p{margin:2px 0;border-bottom:1px solid #ffffff0b;padding-bottom:3px}.hand-area{padding:18px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{min-height:150px;background:linear-gradient(155deg,#3a3035,#211c22);border:1px solid #78616a;padding:12px 10px;text-align:left;color:var(--cream);position:relative;transition:.18s}.card:hover:not(:disabled){transform:translateY(-5px);border-color:var(--gold)}.card:disabled{opacity:.4;cursor:not-allowed}.card .symbol{font-size:23px;color:var(--gold)}.card strong{display:block;font-size:13px;margin:7px 0}.card p{font-size:10px;color:#b7a9a9;line-height:1.6;margin:0}.cost{position:absolute;right:9px;top:9px;border:1px solid #b99562;border-radius:50%;width:20px;height:20px;text-align:center;line-height:18px;font:12px Georgia;color:#e1c18d}
.actions{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.action{background:#28232a;border:1px solid #66545b;color:#d9cabb;padding:10px 18px;font-size:12px;letter-spacing:1px}.action:hover{border-color:var(--gold)}.action:disabled{opacity:.35;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:#09080bdc;display:none;place-items:center;padding:20px;z-index:5}.overlay.show{display:grid}.result{max-width:430px;width:100%;padding:38px;text-align:center}.result h2{font:42px 'Ma Shan Zheng',cursive;color:var(--gold);margin:0 0 8px}.result p{font-size:13px;color:#c0b4b2;line-height:1.8}.result button{margin-top:18px}
.footer{text-align:center;color:#756b70;font:10px Georgia;letter-spacing:2px;margin-top:32px}
@media(max-width:700px){.shell{padding:18px 12px 35px}.characters{grid-template-columns:1fr}.arena,.board{grid-template-columns:1fr}.hand{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-height:165px;padding:9px 7px}.card p{font-size:9px}.brand{font-size:28px}.hero{padding:28px 0 20px}.setup{padding:22px 16px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">迷雾牌局<small>MIST CARD GAME</small></div><div class="version">PROTOTYPE · V0.1.0</div></header>
<section class="hero"><div class="eyebrow">THE FOG IS NEVER EMPTY</div><h1>庄园的最后一局</h1><div class="subtitle">每一张牌，都是一次选择。每一次选择，都留下代价。</div></section>
<section class="panel setup" id="setup">
<h2 class="section-title">选择你的求生者</h2>
<div class="characters" id="characters">
<button class="character selected" data-id="seer"><div class="sigil">◉</div><h3>先知 · 伊莱</h3><p>洞察局势，预见危险。初始获得额外护盾。</p><div class="tag">天赋：预兆</div></button>
<button class="character" data-id="doctor"><div class="sigil">✚</div><h3>医生 · 艾米丽</h3><p>擅长自我修复。治疗行动效果更强。</p><div class="tag">天赋：疗愈</div></button>
<button class="character" data-id="thief"><div class="sigil">⌁</div><h3>慈善家 · 克利切</h3><p>行动灵活，善于寻找机会。初始能量更多。</p><div class="tag">天赋：灵巧</div></button>
</div>
<button class="start" id="start">踏入迷雾</button>
</section>
<section class="game" id="game">
<div class="arena">
<div class="panel fighter enemy"><div class="fighter-head"><div><div class="role">THE HUNTER</div><div class="fighter-name">监管者 · 雾中人</div></div><div class="sigil">♜</div></div><div class="stats"><div class="stat">生命<b id="enemyHp">30</b></div><div class="stat">压迫<b id="enemyFear">0</b></div></div><div class="bar"><span id="enemyBar" style="width:100%"></span></div></div>
<div class="panel fighter player"><div class="fighter-head"><div><div class="role">THE SURVIVOR</div><div class="fighter-name" id="playerName">先知 · 伊莱</div></div><div class="sigil">♙</div></div><div class="stats"><div class="stat">生命<b id="playerHp">24</b></div><div class="stat">能量<b id="energy">3</b></div><div class="stat">护盾<b id="shield">3</b></div></div><div class="bar"><span id="playerBar" style="width:100%"></span></div></div>
</div>
<div class="statusline" id="round">第一回合 · 你的行动</div>
<div class="board">
<div class="panel hand-area"><h3>手牌 · 选择一张牌打出</h3><div class="hand" id="hand"></div><div class="actions"><button class="action" id="endTurn">结束回合 ↗</button><button class="action" id="redraw">弃牌重抽（1能量）</button></div></div>
<div class="panel log"><h3>庄园记录</h3><div class="loglist" id="log"><p>雾气漫过庄园。你听见远处传来钟声。</p></div></div>
</div>
</section>
<div class="footer">AN ORIGINAL FAN-INSPIRED CARD GAME · MADE ONE TURN AT A TIME</div>
</div>
<div class="overlay" id="overlay"><div class="panel result"><h2 id="resultTitle">迷雾散去</h2><p id="resultText"></p><button class="start" id="restart">再开一局</button></div></div>
<script>
const characters={
seer:{name:'先知 · 伊莱',hp:24,energy:3,shield:3,heal:3,bonus:'预兆'},
doctor:{name:'医生 · 艾米丽',hp:28,energy:3,shield:0,heal:6,bonus:'疗愈'},
thief:{name:'慈善家 · 克利切',hp:24,energy:4,shield:0,heal:3,bonus:'灵巧'}
};
const deck=[
{id:'strike',name:'破雾一击',symbol:'⚔',cost:1,desc:'对监管者造成 6 点伤害。',type:'attack',value:6},
{id:'focus',name:'冷静观察',symbol:'⌕',cost:1,desc:'获得 2 点能量，并抽取一张牌。',type:'focus',value:2},
{id:'heal',name:'急救包',symbol:'✚',cost:2,desc:'恢复 7 点生命。医生恢复 10 点。',type:'heal',value:7},
{id:'evade',name:'翻窗闪避',symbol:'↗',cost:1,desc:'获得 5 点护盾，抵挡下一次攻击。',type:'shield',value:5},
{id:'ambush',name:'声东击西',symbol:'♧',cost:2,desc:'造成 10 点伤害，但自身承受 2 点反噬。',type:'risk',value:10},
{id:'insight',name:'密码推演',symbol:'⌘',cost:1,desc:'削弱监管者警戒，本回合攻击降低。',type:'weaken',value:3},
{id:'resolve',name:'绝境意志',symbol:'✧',cost:2,desc:'恢复 4 点生命并获得 3 点护盾。',type:'resolve',value:4},
{id:'counter',name:'精准反制',symbol:'◈',cost:2,desc:'对监管者造成 8 点伤害。',type:'attack',value:8}
];
let selected='seer',state=null,serial=0;
const $=id=>document.getElementById(id);
document.querySelectorAll('.character').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.character').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.id}));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function log(msg){const p=document.createElement('p');p.textContent=msg;$('log').prepend(p)}
function draw(n=1){for(let i=0;i<n;i++){if(!state.deck.length)state.deck=shuffle(deck);state.hand.push(state.deck.pop())}}
function start(){
const c=characters[selected];state={hero:{...c},hp:c.hp,shield:c.shield,energy:c.energy,enemyHp:30,fear:0,round:1,hand:[],deck:shuffle([...deck,...deck]),weaken:0,over:false};
$('setup').classList.add('hidden');$('game').classList.add('active');$('overlay').classList.remove('show');$('playerName').textContent=c.name;$('log').innerHTML='';log('你选择了'+c.name+'。庄园的大门在身后缓缓合拢。');draw(3);render();
}
function render(){
$('playerHp').textContent=state.hp;$('enemyHp').textContent=state.enemyHp;$('energy').textContent=state.energy;$('shield').textContent=state.shield;$('enemyFear').textContent=state.fear;
$('playerBar').style.width=Math.max(0,state.hp/state.hero.hp*100)+'%';$('enemyBar').style.width=Math.max(0,state.enemyHp/30*100)+'%';$('round').textContent='第 '+state.round+' 回合 · 你的行动';
$('hand').innerHTML='';
state.hand.forEach((card,i)=>{const b=document.createElement('button');b.className='card';b.disabled=state.over||state.energy<card.cost;b.innerHTML='<span class="cost">'+card.cost+'</span><div class="symbol">'+card.symbol+'</div><strong>'+card.name+'</strong><p>'+card.desc+'</p>';b.addEventListener('click',()=>play(i));$('hand').append(b)});
$('endTurn').disabled=state.over;$('redraw').disabled=state.over||state.energy<1||!state.hand.length;
}
function play(i){
const c=state.hand[i];if(!c||state.energy<c.cost||state.over)return;state.energy-=c.cost;state.hand.splice(i,1);
switch(c.type){
case'attack':state.enemyHp-=c.value;log(c.name+'：造成 '+c.value+' 点伤害。');break;
case'focus':state.energy=Math.min(5,state.energy+c.value);draw(1);log('你稳住心神，重新掌握节奏。');break;
case'heal':{const v=state.hero.heal===6?10:c.value;const old=state.hp;state.hp=Math.min(state.hero.hp,state.hp+v);log('治疗恢复 '+(state.hp-old)+' 点生命。');break}
case'shield':state.shield+=c.value;log('你获得 '+c.value+' 点护盾。');break;
case'risk':state.enemyHp-=c.value;state.hp-=2;log('声东击西奏效，造成 '+c.value+' 点伤害，自身受到 2 点反噬。');break;
case'weaken':state.weaken=c.value;log('你看穿了监管者的动作，削弱其下一次攻击。');break;
case'resolve':{const old=state.hp;state.hp=Math.min(state.hero.hp,state.hp+c.value);state.shield+=3;log('意志坚定：恢复 '+(state.hp-old)+' 点生命并获得 3 点护盾。');break}
}
check();render();
}
function enemyTurn(){
if(state.over)return;
const dmg=Math.max(1,6+Math.floor(state.round/3)-state.weaken);state.weaken=0;
const blocked=Math.min(state.shield,dmg);state.shield-=blocked;const actual=dmg-blocked;state.hp-=actual;state.fear+=2;
log('监管者逼近：攻击 '+dmg+' 点，护盾抵挡 '+blocked+' 点，你损失 '+actual+' 点生命。');
check();if(state.over)return;
state.round++;state.energy=Math.min(5,state.hero.energy+Math.min(1,Math.floor((state.round-1)/3)));draw(Math.max(0,3-state.hand.length));render();
}
function check(){
if(state.enemyHp<=0){state.enemyHp=0;finish(true);return}
if(state.hp<=0){state.hp=0;finish(false)}
}
function finish(win){state.over=true;$('resultTitle').textContent=win?'雾散之后':'庄园留住了你';$('resultText').textContent=win?'你击退了监管者，暂时赢得了自由。真正的出口，也许还在更深处。':'你的脚步停在浓雾里。整理手牌，再试一次吧。';$('overlay').classList.add('show')}
$('start').addEventListener('click',start);
$('endTurn').addEventListener('click',enemyTurn);
$('redraw').addEventListener('click',()=>{if(state.energy<1||!state.hand.length)return;state.energy--;state.hand=state.hand.slice(1);draw(1);log('你放弃一张手牌，重新寻找机会。');render()});
$('restart').addEventListener('click',()=>{$('overlay').classList.remove('show');$('game').classList.remove('active');$('setup').classList.remove('hidden')});
</script>
</body>
</html>
